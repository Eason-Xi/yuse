/* 版式：整部作品是一张满幅的纸，没有网页界面；字全部画进画布里，这里只留一个收尾按钮 */
:root { --paper: #ece9e1; --ink: #14151a; --glow: #c8d4ee; color-scheme: light; }
html, body { height: 100%; margin: 0; background: var(--paper); overflow: hidden; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; cursor: none; user-select: none; -webkit-user-select: none; }
#cta { position: fixed; left: 50%; top: 66%; transform: translateX(-50%); font: 400 clamp(15px, 2.1vh, 20px)/1 "YS Fang", "Songti SC", serif; letter-spacing: .28em; padding: .9em 1.5em .9em 1.8em; color: var(--glow); background: transparent; border: 1px solid color-mix(in srgb, var(--glow) 42%, transparent); border-radius: 0; opacity: 0; transition: opacity 1.6s; cursor: pointer; z-index: 3; }
#cta.on { opacity: 1; }
#cta:hover { background: color-mix(in srgb, var(--glow) 12%, transparent); }
#cta:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
[hidden] { display: none !important; }
#no { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; font: 400 18px/1.8 "Songti SC", serif; color: var(--ink); text-align: center; }
</style>
<canvas id="c" aria-label="余色：一张会流动的宣纸。按下、拖动来和水面互动。"></canvas>
<button id="cta" type="button" hidden>复制这两个字</button>
<div id="no" hidden>这部作品需要 WebGL2。请换一台电脑，或用新版 Chrome、Edge、Safari 打开。</div>
<script>
const Q = Object.fromEntries(new URLSearchParams(location.search));
// 《余色》着色器。全部物理都在这里：
// 纸上用 Kubelka–Munk 减色模型，光里用加色模型，两者读的是同一份颜料数据。
const VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){ vUv=aPos*.5+.5; gl_Position=vec4(aPos,0.,1.); }`;

const VS_SPRITE = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
uniform vec4 uRect;
out vec2 vUv;
void main(){ vec2 q=aPos*.5+.5; vUv=vec2(q.x,1.-q.y); gl_Position=vec4(uRect.xy+q*uRect.zw,0.,1.); }`;

const HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
`;

const NOISE = `
float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec2 h22(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=mat2(1.6,1.2,-1.2,1.6)*p;a*=.5;}return s;}
`;

const FS = {};

// ---------- 流体 ----------
FS.curl = HEAD + `
uniform sampler2D uVel; uniform vec2 uT;
void main(){
  float L=texture(uVel,vUv-vec2(uT.x,0)).y, R=texture(uVel,vUv+vec2(uT.x,0)).y;
  float B=texture(uVel,vUv-vec2(0,uT.y)).x, T=texture(uVel,vUv+vec2(0,uT.y)).x;
  o=vec4(.5*(R-L-T+B),0,0,1);
}`;

FS.vort = HEAD + `
uniform sampler2D uVel,uCurl; uniform vec2 uT; uniform float uK,uDt;
void main(){
  float L=texture(uCurl,vUv-vec2(uT.x,0)).x, R=texture(uCurl,vUv+vec2(uT.x,0)).x;
  float B=texture(uCurl,vUv-vec2(0,uT.y)).x, T=texture(uCurl,vUv+vec2(0,uT.y)).x;
  float C=texture(uCurl,vUv).x;
  vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));
  f/=length(f)+1e-4; f*=uK*C; f.y*=-1.;
  vec2 v=texture(uVel,vUv).xy+f*uDt;
  o=vec4(clamp(v,-1500.,1500.),0,1);
}`;

FS.div = HEAD + `
uniform sampler2D uVel; uniform vec2 uT;
void main(){
  vec2 c=texture(uVel,vUv).xy;
  float L=texture(uVel,vUv-vec2(uT.x,0)).x, R=texture(uVel,vUv+vec2(uT.x,0)).x;
  float B=texture(uVel,vUv-vec2(0,uT.y)).y, T=texture(uVel,vUv+vec2(0,uT.y)).y;
  if(vUv.x-uT.x<0.)L=-c.x; if(vUv.x+uT.x>1.)R=-c.x;
  if(vUv.y-uT.y<0.)B=-c.y; if(vUv.y+uT.y>1.)T=-c.y;
  o=vec4(.5*(R-L+T-B),0,0,1);
}`;

FS.prs = HEAD + `
uniform sampler2D uP,uDiv; uniform vec2 uT;
void main(){
  float L=texture(uP,vUv-vec2(uT.x,0)).x, R=texture(uP,vUv+vec2(uT.x,0)).x;
  float B=texture(uP,vUv-vec2(0,uT.y)).x, T=texture(uP,vUv+vec2(0,uT.y)).x;
  o=vec4((L+R+B+T-texture(uDiv,vUv).x)*.25,0,0,1);
}`;

FS.grad = HEAD + `
uniform sampler2D uP,uVel; uniform vec2 uT;
void main(){
  float L=texture(uP,vUv-vec2(uT.x,0)).x, R=texture(uP,vUv+vec2(uT.x,0)).x;
  float B=texture(uP,vUv-vec2(0,uT.y)).x, T=texture(uP,vUv+vec2(0,uT.y)).x;
  o=vec4(texture(uVel,vUv).xy-vec2(R-L,T-B),0,1);
}`;

FS.advV = HEAD + `
uniform sampler2D uVel; uniform vec2 uT; uniform float uDt,uDamp;
void main(){
  vec2 c=vUv-uDt*texture(uVel,vUv).xy*uT;
  o=vec4(texture(uVel,c).xy/(1.+uDamp*uDt),0,1);
}`;

FS.splat = HEAD + `
uniform sampler2D uBase; uniform vec2 uPt; uniform vec4 uCol; uniform float uR,uA;
void main(){
  vec2 p=vUv-uPt; p.x*=uA;
  o=texture(uBase,vUv)+exp(-dot(p,p)/uR)*uCol;
}`;

// 绕中心的慢旋，用于"全"一章
FS.swirl = HEAD + `
uniform sampler2D uVel; uniform float uK,uA,uDt,uTime;
${NOISE}
void main(){
  vec2 p=vUv-.5; p.x*=uA; float r=length(p)+1e-3;
  vec2 t=vec2(-p.y,p.x)/r;
  float n=fbm(vUv*3.+uTime*.05)-.5;
  vec2 v=texture(uVel,vUv).xy+t*uK*uDt*smoothstep(.0,.2,r)*(1.-smoothstep(.5,1.1,r))*(1.+n*2.);
  o=vec4(v,0,1);
}`;

// ---------- 颜料：平流 + 滴落 + 渗透 + 老化 ----------
// dye 四个通道：R 丹（朱砂） G 青（石青） B 岁月里长出来的黑 A 水
FS.dye = HEAD + `
uniform sampler2D uDye,uVel,uPaper;
uniform vec2 uT,uST;
uniform float uDt,uA,uDiff,uWetDiff,uShear,uAge,uSoil,uWetDecay,uFeather;
uniform int uN; uniform vec4 uD[12]; uniform vec4 uC[12];
${NOISE}
vec4 cat(vec2 uv){
  vec2 sz=1./uT; vec2 p=uv*sz; vec2 t1=floor(p-.5)+.5; vec2 f=p-t1;
  vec2 w0=f*(-.5+f*(1.-.5*f));
  vec2 w1=1.+f*f*(-2.5+1.5*f);
  vec2 w2=f*(.5+f*(2.-1.5*f));
  vec2 w3=f*f*(-.5+.5*f);
  vec2 w12=w1+w2; vec2 o12=w2/w12;
  vec2 a=(t1-1.)*uT, b=(t1+2.)*uT, c=(t1+o12)*uT;

FS.comp = HEAD + `
uniform sampler2D uDye,uPaper,uCrack,uText,uDust,uTear;

  vec2 pL=p+vec2(g,0.); pL.x+=th*(p.y-.5);
  vec2 pR=p-vec2(g,0.); pR.x-=th*(p.y-.5);
  float eL=tx(pL.y)-pL.x, eR=pR.x-tx(pR.y);
  float side=eL>0.?0.:(eR>0.?1.:2.);
  if(g<=.00001) side=eL>0.?0.:1.;
  vec2 q=side<.5?pL:(side<1.5?pR:p);
  float edge=side<.5?eL:eR;
  vec2 pu=q/vec2(uAf,1.);
  bool isVoid=side>1.5;
  vec4 d=isVoid?vec4(0.):texture(uDye,pu);
  d*=1.-plain;
  vec4 pa=texture(uPaper,pu);
  vec4 t=texture(uText,uv);
  // ---- 颜料颗粒与干燥边缘 ----
  vec3 c=d.rgb;
  c*=1.+uGran*((pa.a-.5)+(pa.r-.5)*.9);
  if(uDry>.001){
    vec3 a=texture(uDye,pu+vec2(uT.x*1.5,0)).rgb+texture(uDye,pu-vec2(uT.x*1.5,0)).rgb+texture(uDye,pu+vec2(0,uT.y*1.5)).rgb+texture(uDye,pu-vec2(0,uT.y*1.5)).rgb;

  float onC=smoothstep(ck.b,ck.b+.08,uCrackT);
  float onF=smoothstep(ck.b+.1,ck.b+.28,uCrackT);

  float lineF=onF*(1.-smoothstep(.0,.03,ck.g))*.75;

  if(uLine.w>0.){

// 文字层：所有字都是竖排的题跋，画进纸里，而不是浮在网页上
const FONT = {

const INK = { dan: [1, 0, 0], qing: [0, 1, 0], sumi: [0, 0, 1], grey: [0, 0, .55] };

const T = (() => {
  const list = [];
  const tw = [];
  const isRot = c => '…—～《》「」“”（）()-'.includes(c);
  const isCorner = c => '，。、'.includes(c);

  function tokens(s) {
    const out = []; let i = 0;
    while (i < s.length) {
      const m = /^[0-9A-Za-z.,:%¥+\/]+/.exec(s.slice(i));

  function colH(s, size, lh) {

      if (t.length > 2 && /^[0-9A-Za-z¥]/.test(t)) {
        const L = t.length * .56 * lh; cy += L * .5 - lh * .5;
        x.save(); x.translate(cx, cy); x.rotate(Math.PI / 2); x.fillText(t, 0, 0); x.restore();
        cy += L * .5 + lh * .5 + lh * .1 - lh * .0; continue;
      }
      if (t.length === 2) { x.save(); x.translate(cx, cy); x.scale(.82, 1); x.fillText(t, 0, 0); x.restore(); cy += lh; continue; }
      if (isCorner(t)) x.fillText(t, cx + size * .54, cy - size * .46);
      else if (isRot(t)) { x.save(); x.translate(cx, cy); x.rotate(Math.PI / 2); x.fillText(t, 0, 0); x.restore(); }
      else x.fillText(t, cx, cy);
      cy += lh;

// ---------- 时钟（跟着画面走：切到别的标签页，故事就停下等你） ----------
const Clock = {
  list: [], skipNow: null,
  step(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const w = this.list[i]; w.t -= dt * SPEED;
      if (w.t <= 0) { this.list.splice(i, 1); if (this.skipNow === w) this.skipNow = null; w.res(); }
    }
  },
};
function wait(s, o = {}) {
  return new Promise(res => {
    const w = { t: o.exact ? s : s * PACE, res }; Clock.list.push(w);
    if (!o.noskip) Clock.skipNow = w;
  });
}
function skip() { const w = Clock.skipNow; if (w) w.t = 0; }

const Ptr = { x: .5, y: .5, px: .5, py: .5, held: false, mode: 'none', stirred: 0, washed: 0, downT: 0, downX: 0, downY: 0, onPress: null, onClick: null };

function press() { return new Promise(res => { Ptr.onPress = res; if (Q.auto) wait(1.4, { noskip: true }).then(() => { if (Ptr.onPress === res) { Ptr.onPress = null; res(); } }); }); }
function hold(sec, onP) {
  return new Promise(res => {
    let p = 0;
    holdTask = dt => {
      p += (Ptr.held ? dt * SPEED : -dt * 1.5); p = Math.max(0, Math.min(sec, p)); onP(p / sec);
      if (p >= sec) { holdTask = null; res(); }
    };
  });
}

let waterTick = 0;
function pointerStep(dt) {
  const S = E.S, m = Ptr.mode;
  const dx = Ptr.x - Ptr.px, dy = Ptr.y - Ptr.py, sp = Math.hypot(dx, dy);
  const f = E.s2f(Ptr.x, Ptr.y), fp = E.s2f(Ptr.px, Ptr.py);
  const target = (m === 'none' || m === 'lens' || FILM) ? 0 : .8;
  S.brush[3] += (target - S.brush[3]) * Math.min(1, dt * 6);
  S.brush[0] = f[0] * E.Af; S.brush[1] = f[1]; S.brush[2] = m === 'wash' ? .05 : .018;
  if (sp > 0 && !S.frozen) {
    if (m === 'stir') { const wk = Ptr.weak || 1; if (Ptr.held) { E.stir(fp[0], fp[1], f[0], f[1], .62 * wk, .0014); Ptr.stirred += sp; } else { E.stir(fp[0], fp[1], f[0], f[1], .24 * wk, .0009); Ptr.stirred += sp * .5; } }
    if (m === 'light') {
      E.stir(fp[0], fp[1], f[0], f[1], FILM ? .3 : .42, .0009);
      const w = Math.min(1, sp * 40);
      E.splatD(f[0], f[1], f[0] > .5 ? [.11 * w, 0, 0, 0] : [0, .11 * w, 0, 0], .00016);
      A.harp(Ptr.x, Ptr.y, sp);
    }
  }
  if (m === 'wash' && sp > 0) {
    const g = S.gap, th = S.tilt, px = f[0] * E.Af, py = f[1];
    const left = px < .5 * E.Af;
    const qx = left ? px + g + th * (py - .5) : px - g - th * (py - .5);
    E.wipe(qx / E.Af, py, .0075, .22);
    Ptr.washed += sp * 3;
    if (Math.random() < .3) A.plink((Ptr.x - .5) * 1.2, 1300 + Math.random() * 900, .03);
  }
  waterTick = (waterTick + 1) % (FILM ? 10 : 4); if (waterTick === 0) A.water(!S.frozen && (m === 'stir' || m === 'light') || m === 'wash' ? sp : 0);
  if (m === 'lens') { S.lens[0] += (f[0] - S.lens[0]) * .2; S.lens[1] += (f[1] - S.lens[1]) * .2; }
  Ptr.px = Ptr.x; Ptr.py = Ptr.y;
}
// 自动模式下的手：沿一条慢慢漂移的曲线划过纸面
let autoT = 0, handFn = null;
function setHand(fn, sec) { if (!FILM) return; handFn = fn; if (sec) wait(sec, { noskip: true, exact: true }).then(() => { if (handFn === fn) handFn = null; }); }
function autoHand(dt) {
  autoT += dt;
  if (FILM) {
    Ptr.held = !!holdTask;
    if (handFn) { const p = handFn(autoT); Ptr.x = p[0]; Ptr.y = p[1]; Ptr.held = true; }
    return;
  }
  const m = Ptr.mode, on = m === 'stir' || m === 'light' || m === 'wash' || m === 'lens';
  const burstOn = Math.sin(autoT * .31) > .55;
  Ptr.held = !!holdTask || (on && burstOn);
  if (on && burstOn) { Ptr.x = .5 + .34 * Math.sin(autoT * .47) * Math.cos(autoT * .13); Ptr.y = .5 + .38 * Math.sin(autoT * .61 + 1.1); }
}
function frame(dt) {

  pointerStep(dt); snowStep(dt);

  addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); Ptr.held = true; if (Ptr.onPress) { const f = Ptr.onPress; Ptr.onPress = null; f(); } else skip(); }
    if (e.code === 'ArrowRight') skip();
  });
  addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') Ptr.held = false; });
  // 窗口变了，已经在纸上的字要跟着走
  addEventListener('resize', () => {
    const w0 = E.W, h0 = E.H;
    if (!E.resize(quality)) return;
    const sx = E.W / w0, sy = E.H / h0, k = Math.min(sx, sy);
    for (const s of T.list) {
      const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
      s.w *= k; s.h *= k; s.x = cx * sx - s.w / 2; s.y = cy * sy - s.h / 2;
    }
  });
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}

  // 只重新渲染声音：读回事件表，不再跑画面
  if (Q.replay) {
    const list = await (await fetch('http://127.0.0.1:8732/file?name=events.json')).json();
    window.__y = { A, list };
    await A.renderLog(list, 'http://127.0.0.1:8732/frame?name=audio.wav');
    window.__done = 1; return;
  }
  // 录制模式：固定步长，每隔若干帧把画面送给本地抓帧服务
  if (Q.rec) {
    const every = +(Q.every || 120), batch = +(Q.batch || 6), base = 'http://127.0.0.1:8732/';
    let n = 0, shot = 0;
    const pipeEvery = +(Q.pipe || 0);
    if (pipeEvery) await fetch(base + 'pipe/start?fps=' + (60 / pipeEvery) + '&out=' + (Q.out || 'film.mp4'));
    const tick = async () => {
      for (let i = 0; i < batch; i++) {
        frame(1 / 60); n++;
        if (pipeEvery && n % pipeEvery === 0) {
          const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', +(Q.q || .95)));
          await fetch(base + 'pipe/frame', { method: 'POST', body: blob });
        }
        if (n % every === 0) {
          const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', +(Q.q || .9)));
          await fetch(base + 'frame?name=' + (Q.tag || 'f') + String(shot++).padStart(5, '0') + '.jpg', { method: 'POST', body: blob });
        }
      }
      window.__frames = n;
      E.gl.finish();
      if (window.__finished) {
        if (pipeEvery) await fetch(base + 'pipe/end');
        if (Q.offline) {
          await fetch(base + 'frame?name=events.json', { method: 'POST', body: JSON.stringify(A.evts) });
          await A.renderLog(A.evts, base + 'frame?name=audio.wav');
        }
        window.__done = n;
        await fetch(base + 'log?finished_' + n);
        return;
      }
      setTimeout(tick, 0);
    };
    window.__y = { E, T, A, Tw, Ptr, Clock, L };
    setTimeout(tick, 0);
    main().catch(err => console.error(err));
    return;
  }
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.05, Math.max(.001, (now - last) / 1000)); last = now;
    frame(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.__y = { E, T, A, Tw, Ptr, Clock, L };
  main().catch(err => console.error(err));
})();

</script>
